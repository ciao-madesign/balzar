<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo fontana — ricevitore (fotocamera)</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; text-align: center; margin: 0; padding: 1rem; }
  h1 { font-size: 1.1rem; font-weight: 500; color: #aaa; }
  video { width: 100%; max-width: 480px; border-radius: 8px; }
  #stats { font-family: monospace; font-size: 0.85rem; color: #8f8; margin-top: 0.5rem; }
  #bar-bg { background: #333; height: 10px; border-radius: 5px; margin: 1rem auto; max-width: 480px; overflow: hidden; }
  #bar { background: #4caf50; height: 100%; width: 0%; transition: width 0.2s; }
  button { font-size: 1.1rem; padding: 0.6rem 1.2rem; margin-top: 1rem; }
  #result { margin-top: 1rem; }
  .done { color: #4caf50; font-weight: 600; font-size: 1.2rem; }
  .note { color: #888; font-size: 0.85rem; max-width: 480px; margin: 1rem auto; }
</style>
</head>
<body>
  <h1>PROTOTIPO — ricevitore: punta la fotocamera verso lo schermo del mittente</h1>
  <button id="start">Avvia fotocamera</button>
  <video id="video" autoplay playsinline muted style="display:none"></video>
  <div id="bar-bg" style="display:none"><div id="bar"></div></div>
  <div id="stats">pronto</div>
  <div id="result"></div>
  <p class="note">Non fa parte dell'app balzar — prototipo isolato per verificare con hardware reale se
    la codifica "a fontana" funziona meglio di quella attuale, prima di decidere se integrarla.</p>

  <script src="jsQR.min.js"></script>
  <script src="fountain-protocol.js"></script>
  <script src="receiver.js"></script>
</body>
</html>
